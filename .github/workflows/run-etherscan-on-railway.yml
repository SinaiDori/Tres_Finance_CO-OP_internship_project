name: run-etherscan-on-railway

on:
  workflow_dispatch: {}
#   schedule:
#     # 08:00 Jerusalem year-round (month split: IDT UTC+3 vs IST UTC+2)
#     - cron: "0 5 * 4-10 *"     # Apr–Oct: 05:00 UTC = 08:00 IDT
#     - cron: "0 6 * 1-3,11-12 *" # Jan–Mar, Nov–Dec: 06:00 UTC = 08:00 IST

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: etherscan-railway
      cancel-in-progress: false

    env:
      # Set these in repo Settings → Secrets and variables → Actions
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      # Optional: make the container skip noVNC during scheduled runs
      NOVNC: "0"
      # If you added the ALLOW_RUN gate in start.sh, set it here:
      # ALLOW_RUN: "1"

      # Adjust to your repo layout / service name:
      RAILWAY_ROOT: "railway-etherscan"     # matches your “Root Directory” in the screenshot
      RAILWAY_SERVICE: "Tres_Finance_CO-OP_internship_project"  # exact service name in Railway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: curl -fsSL https://railway.app/install.sh | sh

      - name: Login to Railway
        run: ~/.railway/bin/railway login --token "$RAILWAY_TOKEN"

      - name: Set runtime env (optional)
        # These become service variables for this deployment; comment out if you manage them in Railway UI
        run: |
          ~/.railway/bin/railway variables set NOVNC="$NOVNC" --service "$RAILWAY_SERVICE" || true
          # ~/.railway/bin/railway variables set ALLOW_RUN="$ALLOW_RUN" --service "$RAILWAY_SERVICE" || true

      - name: Deploy current repo to Railway (build + run start.sh)
        run: |
          ~/.railway/bin/railway up \
            --service "$RAILWAY_SERVICE" \
            --root "$RAILWAY_ROOT" \
            --detach
