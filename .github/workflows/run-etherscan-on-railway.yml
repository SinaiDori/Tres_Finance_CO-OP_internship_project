name: run-etherscan-on-railway

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 5 * 4-10 *"      # 08:00 Jerusalem (Apr–Oct)
  #   - cron: "0 6 * 1-3,11-12 *" # 08:00 Jerusalem (Jan–Mar, Nov–Dec)

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: etherscan-railway
      cancel-in-progress: false

    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      NOVNC: "0"
      RAILWAY_ROOT: "railway-etherscan"              # folder with your railway.json / Dockerfile
      RAILWAY_SERVICE: "Tres_Finance_CO-OP_internship_project"  # exact service name in Railway

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (for CLI install)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Show CLI version
        run: railway --version

      - name: Login to Railway
        run: railway login --token "$RAILWAY_TOKEN"

      - name: (Optional) Set runtime variables for this service
        run: |
          railway variables set NOVNC="$NOVNC" --service "$RAILWAY_SERVICE" || true
          # railway variables set ALLOW_RUN="1" --service "$RAILWAY_SERVICE" || true

      - name: Deploy current repo to Railway (build + run start.sh)
        run: |
          railway up \
            --service "$RAILWAY_SERVICE" \
            --root "$RAILWAY_ROOT" \
            --detach
