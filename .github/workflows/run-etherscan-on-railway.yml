# GITHUB ACTIONS WORKFLOW - RAILWAY CLOUD DEPLOYMENT FOR ETHERSCAN AUTOMATION
# This workflow orchestrates cloud deployment of the Etherscan API key generation process to
# Railway platform instead of running directly in GitHub Actions. It uses Railway CLI to deploy
# the containerized automation environment, sets runtime configuration variables, and triggers
# remote execution with visual monitoring capabilities. This approach provides better resource
# allocation, persistent VNC access for debugging, and separates the execution environment from
# the CI/CD pipeline while maintaining scheduled automation and timezone-aware cron jobs.
# The workflow runs each mornoing at 8:00 local time.

name: run-etherscan-on-railway

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 5 * 4-10 *"      # 08:00 Jerusalem (Apr–Oct, UTC+3)
    - cron: "0 6 * 1-3,11-12 *" # 08:00 Jerusalem (Jan–Mar, Nov–Dec, UTC+2)

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: etherscan-railway
      cancel-in-progress: false

    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}   # <-- Project token
      NOVNC: "0"                                    # optional for headless cron runs
      RAILWAY_SERVICE: "Tres_Finance_CO-OP_internship_project"  # exact service name

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (for Railway CLI)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Show CLI version
        run: railway --version

      # (Optional) set/update a runtime variable on the service for this env
      - name: Set runtime variables on the service
        run: |
          railway variables set --service "$RAILWAY_SERVICE" NOVNC="$NOVNC" || true

      - name: Deploy to Railway
        run: railway up --service "$RAILWAY_SERVICE" --detach --ci
        
