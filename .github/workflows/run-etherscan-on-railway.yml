name: run-etherscan-on-railway

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 5 * 4-10 *"      # 08:00 Jerusalem (Apr–Oct, UTC+3)
  #   - cron: "0 6 * 1-3,11-12 *" # 08:00 Jerusalem (Jan–Mar, Nov–Dec, UTC+2)

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: etherscan-railway
      cancel-in-progress: false

    env:
      # Set this secret in: Repo → Settings → Secrets and variables → Actions
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      NOVNC: "0"  # optional: skip noVNC for scheduled runs
      RAILWAY_ROOT: "railway-etherscan"   # folder with Dockerfile/railway.json
      RAILWAY_SERVICE: "Tres_Finance_CO-OP_internship_project"  # EXACT service name

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node (for CLI install)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Show CLI version
        run: railway --version

      # No login step needed – the CLI reads RAILWAY_TOKEN automatically in CI

      - name: (Optional) Set runtime variables on the service
        run: |
          railway variables set NOVNC="$NOVNC" --service "$RAILWAY_SERVICE" || true
          # railway variables set ALLOW_RUN="1" --service "$RAILWAY_SERVICE" || true

      - name: Deploy current repo (build + run start.sh)
        run: |
          railway up \
            --service "$RAILWAY_SERVICE" \
            --root "$RAILWAY_ROOT" \
            --detach
