name: etherscan-agent

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 2 * * *"   # daily at 02:00 UTC

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: etherscan-agent
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps (Xvfb + ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg

      # Cache pip wheels
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements2.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # NEW: Start FlareSolverr with improved monitoring
      - name: Start FlareSolverr
        run: |
          echo "🚀 Starting FlareSolverr..."
          
          # Check Docker availability
          docker --version
          echo "✅ Docker is available"
          
          # Pull FlareSolverr image
          echo "📥 Pulling FlareSolverr image..."
          docker pull ghcr.io/flaresolverr/flaresolverr:latest
          echo "✅ Image pulled successfully"
          
          # Start FlareSolverr container
          echo "🔄 Starting FlareSolverr container..."
          docker run -d \
            --name flaresolverr \
            -p 8191:8191 \
            -e LOG_LEVEL=info \
            -e LOG_HTML=false \
            -e CAPTCHA_SOLVER=none \
            -e HEADLESS=true \
            --restart=no \
            ghcr.io/flaresolverr/flaresolverr:latest
          
          echo "✅ Container started, checking status..."
          docker ps -f name=flaresolverr
          
          # Wait for FlareSolverr with better monitoring (up to 2 minutes)
          echo "⏳ Waiting for FlareSolverr to become ready..."
          for i in {1..24}; do
            echo "🔍 Health check $i/24..."
            
            # Check container is still running
            if ! docker ps -f name=flaresolverr -q | grep -q .; then
              echo "❌ Container stopped running!"
              docker logs flaresolverr 2>&1 | tail -20
              exit 1
            fi
            
            # Check if FlareSolverr responds
            if curl -f -s http://localhost:8191/ >/dev/null 2>&1; then
              response=$(curl -s http://localhost:8191/ 2>/dev/null || echo "")
              if [[ "$response" == *"FlareSolverr"* ]]; then
                echo "✅ FlareSolverr is ready!"
                echo "📝 Response: $response"
                break
              fi
            fi
            
            if [ $i -eq 24 ]; then
              echo "❌ FlareSolverr failed to start after 2 minutes"
              echo "📝 Container status:"
              docker ps -a -f name=flaresolverr
              echo "📝 Container logs (last 30 lines):"
              docker logs flaresolverr 2>&1 | tail -30
              echo "📝 Network check:"
              netstat -tlpn | grep 8191 || echo "Port 8191 not listening"
              exit 1
            fi
            
            sleep 5
          done

      # Install Python dependencies and browsers
      - name: Install Python deps + browsers
        run: |
          set -e
          python -m pip install -U pip
          pip install -r requirements2.txt
          rm -rf ~/.cache/ms-playwright
          python -m patchright install --with-deps --force chromium
          python - <<'PY'
          import os, glob
          bins = glob.glob(os.path.expanduser("~/.cache/ms-playwright/chromium-*/chrome-linux/chrome"))
          print("Found Chromium bins:", bins)
          assert bins, "Chromium browser not installed"
          PY

      # Test FlareSolverr functionality with detailed debugging
      - name: Test FlareSolverr functionality
        run: |
          echo "🔍 Testing FlareSolverr functionality..."
          
          python - <<'PY'
          import requests
          import json
          import time
          
          flaresolverr_url = "http://localhost:8191/v1"
          
          print("🔍 Step 1: Basic connectivity test")
          try:
              health_response = requests.get("http://localhost:8191/", timeout=10)
              print(f"📊 Health check status: {health_response.status_code}")
              print(f"📝 Health response: {health_response.text[:200]}")
          except Exception as e:
              print(f"❌ Health check failed: {e}")
              exit(1)
          
          print("\n🔍 Step 2: Basic FlareSolverr API test")
          test_payload = {
              "cmd": "request.get",
              "url": "https://httpbin.org/ip",
              "maxTimeout": 30000
          }
          
          try:
              print(f"📤 Sending request to: {flaresolverr_url}")
              print(f"📝 Payload: {json.dumps(test_payload, indent=2)}")
              
              response = requests.post(
                  flaresolverr_url,
                  headers={'Content-Type': 'application/json'},
                  json=test_payload,
                  timeout=35
              )
              
              print(f"📊 Response status: {response.status_code}")
              print(f"📝 Response headers: {dict(response.headers)}")
              print(f"📝 Raw response (first 500 chars):")
              print(response.text[:500])
              print(f"📝 Raw response (last 200 chars):")
              print(response.text[-200:])
              
              if response.status_code == 200:
                  if response.text.strip():
                      try:
                          result = response.json()
                          print(f"✅ JSON parsed successfully")
                          print(f"📝 Result status: {result.get('status')}")
                          
                          if result.get('status') == 'ok':
                              solution = result.get('solution', {})
                              response_data = solution.get('response', '')
                              if response_data:
                                  ip_data = json.loads(response_data)
                                  print(f"✅ FlareSolverr basic test passed!")
                                  print(f"📍 IP from test: {ip_data.get('origin')}")
                              else:
                                  print(f"❌ No response data in solution")
                                  exit(1)
                          else:
                              print(f"❌ FlareSolverr error: {result.get('message', 'Unknown error')}")
                              exit(1)
                      except json.JSONDecodeError as json_e:
                          print(f"❌ JSON decode error: {json_e}")
                          print(f"📝 Response was: {repr(response.text)}")
                          exit(1)
                  else:
                      print(f"❌ Empty response from FlareSolverr")
                      exit(1)
              else:
                  print(f"❌ HTTP error {response.status_code}")
                  exit(1)
                  
          except requests.exceptions.ConnectionError as conn_e:
              print(f"❌ Connection error: {conn_e}")
              exit(1)
          except requests.exceptions.Timeout as timeout_e:
              print(f"❌ Timeout error: {timeout_e}")
              exit(1)
          except Exception as e:
              print(f"❌ Unexpected error: {e}")
              import traceback
              traceback.print_exc()
              exit(1)
          
          print(f"\n🎉 FlareSolverr basic functionality confirmed!")
          print(f"✅ Ready to run main script")
          PY

      # Optional: Quick Patchright smoke test
      - name: Patchright smoke test
        run: |
          python - <<'PY'
          from patchright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(headless=True, args=["--no-sandbox","--disable-dev-shm-usage"])
              page = b.new_page()
              page.goto("https://example.com", timeout=60000)
              print("Patchright smoke test - page title:", page.title())
              b.close()
          PY
          
      # Run the main script
      - name: Run script (recorded Xvfb session)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FLARESOLVERR_URL: "http://localhost:8191"
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail

          # Start Xvfb display :99
          Xvfb :99 -screen 0 1650x800x24 -ac +extension RANDR &
          export DISPLAY=:99
          sleep 2

          # Start recording the virtual display
          ffmpeg -y -nostdin -loglevel warning \
            -f x11grab -framerate 20 -video_size 1650x800 -i $DISPLAY \
            -c:v libx264 -preset veryfast -pix_fmt yuv420p run.mp4 &
          REC_PID=$!

          # Run the main script
          set +e
          python main_etherscan.py 2>&1 | tee run.log
          STATUS=$?
          set -e

          # Stop recording cleanly
          kill -INT $REC_PID || true
          wait $REC_PID || true

          exit $STATUS

      # Clean up FlareSolverr (always run)
      - name: Stop FlareSolverr
        if: ${{ always() }}
        run: |
          echo "🧹 Cleaning up FlareSolverr..."
          docker stop flaresolverr || true
          docker rm flaresolverr || true
          echo "✅ Cleanup completed"

      # Slack notification
      - name: Slack message (all keys)
        if: ${{ always() }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ETHERSCAN_CHANNEL_ID: ${{ secrets.SLACK_ETHERSCAN_CHANNEL_ID }}
        run: |
          set -e
          if [ -s etherscan_api_keys.csv ]; then
            JSON_PAYLOAD=$(python - <<'PY'
          import os, json
          ch = os.environ["SLACK_ETHERSCAN_CHANNEL_ID"]
          with open("etherscan_api_keys.csv","r") as f:
              keys = [ln.strip() for ln in f if ln.strip()]
          text = "\n".join(keys) if keys else "No API keys produced."
          print(json.dumps({"channel": ch, "text": text}))
          PY
          )
          else
            JSON_PAYLOAD=$(python - <<'PY'
          import os, json
          print(json.dumps({"channel": os.environ["SLACK_ETHERSCAN_CHANNEL_ID"], "text": "No API keys produced."}))
          PY
          )
          fi
          
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-type: application/json; charset=utf-8" \
            --data "$JSON_PAYLOAD"

      # Upload artifacts
      - name: Upload artifact (CSV)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: etherscan_api_keys_${{ github.run_id }}
          path: etherscan_api_keys.csv
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload full logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: run-log
          path: run.log
          if-no-files-found: ignore

      - name: Upload session video
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: etherscan_run_video_${{ github.run_id }}
          path: run.mp4
          if-no-files-found: ignore
          retention-days: 7

