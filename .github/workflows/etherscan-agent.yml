name: etherscan-agent

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 2 * * *"   # daily at 02:00 UTC

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: etherscan-agent
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps (Xvfb + ffmpeg)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg

      # Cache pip wheels
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements2.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # NEW: Start FlareSolverr before installing other dependencies
      - name: Start FlareSolverr
        run: |
          echo "🚀 Starting FlareSolverr..."
          
          # Pull FlareSolverr Docker image
          docker pull ghcr.io/flaresolverr/flaresolverr:latest
          
          # Start FlareSolverr in background on port 8191
          docker run -d \
            --name flaresolverr \
            -p 8191:8191 \
            -e LOG_LEVEL=info \
            -e LOG_HTML=false \
            -e CAPTCHA_SOLVER=none \
            -e HEADLESS=true \
            ghcr.io/flaresolverr/flaresolverr:latest
          
          # Wait for FlareSolverr to fully start up
          echo "⏳ Waiting for FlareSolverr to start..."
          sleep 15
          
          # Verify FlareSolverr is responding
          for i in {1..12}; do
            if curl -f http://localhost:8191/ > /dev/null 2>&1; then
              echo "✅ FlareSolverr started successfully on port 8191"
              break
            else
              echo "⏳ Attempt $i: Waiting for FlareSolverr..."
              sleep 5
            fi
            
            if [ $i -eq 12 ]; then
              echo "❌ FlareSolverr failed to start after 60 seconds"
              docker logs flaresolverr
              exit 1
            fi
          done

      # IMPORTANT: do NOT cache Playwright/patchright browsers
      - name: Install Python deps + browsers
        run: |
          set -e
          python -m pip install -U pip
          pip install -r requirements2.txt

          # Fresh install of the exact Chromium that patchright expects
          rm -rf ~/.cache/ms-playwright
          python -m patchright install --with-deps --force chromium

          # Sanity check
          python - <<'PY'
          import os, glob
          bins = glob.glob(os.path.expanduser("~/.cache/ms-playwright/chromium-*/chrome-linux/chrome"))
          print("Found Chromium bins:", bins)
          assert bins, "Chromium browser not installed"
          PY

      # NEW: Test FlareSolverr with Etherscan specifically
      - name: Test FlareSolverr with Etherscan
        run: |
          echo "🔍 Testing FlareSolverr with Etherscan..."
          
          python - <<'PY'
          import requests
          import json
          import time
          
          flaresolverr_url = "http://localhost:8191/v1"
          
          # Test 1: Basic FlareSolverr functionality
          print("🧪 Test 1: Basic FlareSolverr functionality")
          test_payload = {
              "cmd": "request.get",
              "url": "https://httpbin.org/ip",
              "maxTimeout": 30000
          }
          
          try:
              response = requests.post(
                  flaresolverr_url,
                  headers={'Content-Type': 'application/json'},
                  json=test_payload,
                  timeout=35
              )
              
              if response.status_code == 200:
                  result = response.json()
                  if result['status'] == 'ok':
                      ip_data = json.loads(result['solution']['response'])
                      print(f"✅ FlareSolverr working - IP: {ip_data['origin']}")
                  else:
                      print(f"❌ FlareSolverr error: {result['message']}")
                      exit(1)
              else:
                  print(f"❌ HTTP error: {response.status_code}")
                  exit(1)
          except Exception as e:
              print(f"❌ FlareSolverr test failed: {e}")
              exit(1)
          
          # Test 2: Etherscan access through FlareSolverr
          print("\n🧪 Test 2: Etherscan access through FlareSolverr")
          etherscan_payload = {
              "cmd": "request.get",
              "url": "https://etherscan.io",
              "maxTimeout": 60000
          }
          
          try:
              print("⏳ Solving Cloudflare challenge for Etherscan...")
              response = requests.post(
                  flaresolverr_url,
                  headers={'Content-Type': 'application/json'},
                  json=etherscan_payload,
                  timeout=70
              )
              
              if response.status_code == 200:
                  result = response.json()
                  if result['status'] == 'ok':
                      html_content = result['solution']['response']
                      cookies = result['solution']['cookies']
                      
                      print(f"✅ FlareSolverr bypassed Cloudflare for Etherscan!")
                      print(f"📊 Response length: {len(html_content)} characters")
                      print(f"🍪 Cookies received: {len(cookies)} cookies")
                      
                      # Verify we got real Etherscan content
                      if "etherscan" in html_content.lower() and "ethereum" in html_content.lower():
                          print("✅ Confirmed: Got real Etherscan homepage (not blocked)")
                          
                          if "register" in html_content.lower():
                              print("✅ Registration functionality appears available")
                          
                      else:
                          print("⚠️ Got response but content doesn't look like Etherscan")
                          print("📝 First 200 chars of response:")
                          print(html_content[:200])
                          
                  else:
                      print(f"❌ FlareSolverr failed to access Etherscan: {result['message']}")
                      exit(1)
              else:
                  print(f"❌ HTTP error accessing Etherscan: {response.status_code}")
                  exit(1)
                  
          except Exception as e:
              print(f"❌ Etherscan test failed: {e}")
              exit(1)
          
          print("\n🎉 All FlareSolverr tests passed! Ready to run main script.")
          PY

      # Optional: Patchright smoke test (keep existing)
      - name: Patchright smoke test
        run: |
          python - <<'PY'
          from patchright.sync_api import sync_playwright
          with sync_playwright() as p:
              b = p.chromium.launch(headless=True, args=["--no-sandbox","--disable-dev-shm-usage"])
              page = b.new_page()
              page.goto("https://example.com", timeout=60000)
              print("Smoke test page title:", page.title())
              b.close()
          PY
          
      - name: Run script (recorded Xvfb session)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FLARESOLVERR_URL: "http://localhost:8191"  # NEW: FlareSolverr URL
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail

          # Start Xvfb display :99
          Xvfb :99 -screen 0 1650x800x24 -ac +extension RANDR &
          export DISPLAY=:99
          sleep 2

          # Start recording the virtual display
          ffmpeg -y -nostdin -loglevel warning \
            -f x11grab -framerate 20 -video_size 1650x800 -i $DISPLAY \
            -c:v libx264 -preset veryfast -pix_fmt yuv420p run.mp4 &
          REC_PID=$!

          # Run your script and capture status
          set +e
          python main_etherscan.py 2>&1 | tee run.log
          STATUS=$?
          set -e

          # Stop recording cleanly
          kill -INT $REC_PID || true
          wait $REC_PID || true

          exit $STATUS

      # NEW: Clean up FlareSolverr (important for CI)
      - name: Stop FlareSolverr
        if: ${{ always() }}
        run: |
          echo "🧹 Cleaning up FlareSolverr..."
          docker stop flaresolverr || true
          docker rm flaresolverr || true
          echo "✅ FlareSolverr cleanup completed"

      - name: Slack message (all keys)
        if: ${{ always() }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_ETHERSCAN_CHANNEL_ID: ${{ secrets.SLACK_ETHERSCAN_CHANNEL_ID }}
        run: |
          set -e
          if [ -s etherscan_api_keys.csv ]; then
            JSON_PAYLOAD=$(python - <<'PY'
          import os, json
          ch = os.environ["SLACK_ETHERSCAN_CHANNEL_ID"]
          with open("etherscan_api_keys.csv","r") as f:
              keys = [ln.strip() for ln in f if ln.strip()]
          text = "\n".join(keys) if keys else "No API keys produced."
          print(json.dumps({"channel": ch, "text": text}))
          PY
          )
          else
            JSON_PAYLOAD=$(python - <<'PY'
          import os, json
          print(json.dumps({"channel": os.environ["SLACK_ETHERSCAN_CHANNEL_ID"], "text": "No API keys produced."}))
          PY
          )
          fi
          
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-type: application/json; charset=utf-8" \
            --data "$JSON_PAYLOAD"

      # Optional: keep a backup artifact (auto-expires)
      - name: Upload artifact (CSV)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: etherscan_api_keys_${{ github.run_id }}
          path: etherscan_api_keys.csv
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload full logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: run-log
          path: run.log
          if-no-files-found: ignore

      - name: Upload session video
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: etherscan_run_video_${{ github.run_id }}
          path: run.mp4
          if-no-files-found: ignore
          retention-days: 7

