name: subscan-agent

on:
  workflow_dispatch: {}
  # schedule:
  #   # Apr–Oct (IDT, UTC+3): 08:00 local = 05:00 UTC
  #   - cron: "0 5 * 4-10 *"
  #   # Jan–Mar & Nov–Dec (IST, UTC+2): 08:00 local = 06:00 UTC
  #   - cron: "0 6 * 1-3,11-12 *"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: subscan-agent
      cancel-in-progress: false

    env:
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: System deps (Xvfb + ffmpeg + WM + fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg fluxbox \
            fonts-noto fonts-liberation fonts-dejavu-core

      # Cache pip wheels
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements2.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Cache Playwright browsers
      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-msplaywright-${{ hashFiles('**/requirements2.txt') }}
          restore-keys: |
            ${{ runner.os }}-msplaywright-

      - name: Install Python deps + Chromium
        run: |
          python -m pip install -U pip
          pip install -r requirements2.txt
          python -m playwright install --with-deps chromium

      # Make Python requests/urllib3 trust ScraperAPI's proxy CA
      - name: Prepare CA bundle for ScraperAPI (requests/certifi)
        run: |
          set -euo pipefail
          CA_TMP=/tmp/scraperapi-proxyca.pem
          curl -fsSL https://api.scraperapi.com/proxyca.pem -o "$CA_TMP"
          python - <<'PY'
          import certifi
          from pathlib import Path
          src = Path(certifi.where())
          dst = Path("/tmp/certifi-plus-scraperapi.pem")
          dst.write_bytes(src.read_bytes() + b"\n" + Path("/tmp/scraperapi-proxyca.pem").read_bytes())
          print("Wrote:", dst)
          PY
                    echo "REQUESTS_CA_BUNDLE=/tmp/certifi-plus-scraperapi.pem" >> $GITHUB_ENV
                    echo "CURL_CA_BUNDLE=/tmp/certifi-plus-scraperapi.pem" >> $GITHUB_ENV

      # Single recorded run through ScraperAPI (rotating resi proxy)
      - name: Run script (recorded via ScraperAPI proxy)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # ScraperAPI proxy credentials
          PROXY_SERVER: http://proxy-server.scraperapi.com:8001
          PROXY_USERNAME: scraperapi.session_number=${{ github.run_id }}
          PROXY_PASSWORD: ${{ secrets.SCRAPERAPI_KEY }}
        run: |
          set -euo pipefail

          # Build an auth URL so libraries that honor env proxy vars (e.g., requests) use the proxy automatically
          PROXY_AUTH_URL="http://${PROXY_USERNAME}:${PROXY_PASSWORD}@${PROXY_SERVER#http://}"
          export HTTP_PROXY="$PROXY_AUTH_URL"
          export HTTPS_PROXY="$PROXY_AUTH_URL"

          # Xvfb + WM
          export DISPLAY=:99
          Xvfb $DISPLAY -screen 0 1650x800x24 -ac +extension RANDR >/tmp/xvfb.log 2>&1 &
          XVFB_PID=$!
          sleep 2
          fluxbox >/dev/null 2>&1 &
          WM_PID=$!
          sleep 1

          # Start recording
          ffmpeg -y -nostdin -loglevel warning \
            -f x11grab -framerate 20 -video_size 1650x800 -i $DISPLAY \
            -c:v libx264 -preset veryfast -pix_fmt yuv420p -movflags +faststart \
            run.mp4 >/dev/null 2>&1 &
          REC_PID=$!

          # Run once and capture logs
          set +e
          python main_sub_scan.py 2>&1 | tee run.log
          STATUS=${PIPESTATUS[0]}
          set -e

          # Cleanup
          kill -INT "$REC_PID" || true
          wait "$REC_PID" || true
          kill "$WM_PID" "$XVFB_PID" || true

          exit $STATUS

      - name: Slack message (all keys)
        if: ${{ always() }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SUB_SCAN_CHANNEL_ID: ${{ secrets.SLACK_SUB_SCAN_CHANNEL_ID }}
        run: |
          set -e
          if [ -s sub_scan_api_keys.csv ]; then
            JSON_PAYLOAD=$(python - <<'PY'
          import os, json
          ch = os.environ["SLACK_SUB_SCAN_CHANNEL_ID"]
          with open("sub_scan_api_keys.csv","r") as f:
              keys = [ln.strip() for ln in f if ln.strip()]
          text = "\n".join(keys) if keys else "No API keys produced."
          print(json.dumps({"channel": ch, "text": text}))
          PY
          )
          else
            JSON_PAYLOAD=$(python - <<'PY'
          import os, json
          print(json.dumps({"channel": os.environ["SLACK_SUB_SCAN_CHANNEL_ID"], "text": "No API keys produced."}))
          PY
          )
          fi
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-type: application/json; charset=utf-8" \
            --data "$JSON_PAYLOAD"

      - name: Upload artifacts (logs + CSV)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: subscan_run_${{ github.run_id }}
          path: |
            run.log
            sub_scan_api_keys.csv
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload session video
        if: ${{ always() }}
        id: upload_video
        uses: actions/upload-artifact@v4
        with:
          name: sub_scan_run_video_${{ github.run_id }}
          path: run.mp4
          if-no-files-found: warn
          retention-days: 7

      - name: Add video link to summary
        if: ${{ always() }}
        run: |
          echo "## Run video" >> $GITHUB_STEP_SUMMARY
          echo "[Watch/download on GitHub](${{ steps.upload_video.outputs.artifact-url }})" >> $GITHUB_STEP_SUMMARY
