name: subscan-agent

on:
  workflow_dispatch: {}
  # schedule:
  #   - cron: "0 5 * * *"   # optional: run daily at 05:00 UTC

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: subscan-agent
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps (Xvfb for headful Chromium)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      # ✅ Cache pip wheels
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ✅ Cache Playwright browsers
      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run script (headful via Xvfb)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # add your other secrets here if needed
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          xvfb-run -a python main_sub_scan.py 2>&1 | tee run.log

      - name: Upload output CSV (if created)
        uses: actions/upload-artifact@v4
        with:
          name: subscan_api_keys
          path: sub_scan_api_keys.csv
          if-no-files-found: ignore

      - name: Upload full logs
        uses: actions/upload-artifact@v4
        with:
          name: run-log
          path: run.log
          if-no-files-found: ignore
