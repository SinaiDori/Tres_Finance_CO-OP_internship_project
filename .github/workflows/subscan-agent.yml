name: subscan-agent

on:
  workflow_dispatch: {}   # run manually from the Actions tab
  # schedule:
  #   - cron: "0 5 * * *"   # optional: run daily at 05:00 UTC

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: subscan-agent
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps (Xvfb for headful Chromium)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # OPTION A (matches your local code: headless=False)
      - name: Run script (headful via Xvfb)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # add your other secrets here, e.g.:
          # TEMPMAIL_TOKEN: ${{ secrets.TEMPMAIL_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          # tee logs to a file so we can download them
          xvfb-run -a python main_sub_scan.py 2>&1 | tee run.log

      # OPTION B (if you flip your BrowserProfile to headless=True, use this instead)
      # - name: Run script (headless)
      #   env:
      #     OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      #   run: |
      #     python your_script.py 2>&1 | tee run.log

      - name: Upload output CSV (if created)
        uses: actions/upload-artifact@v4
        with:
          name: subscan_api_keys
          path: sub_scan_api_keys.csv
          if-no-files-found: ignore

      - name: Upload full logs
        uses: actions/upload-artifact@v4
        with:
          name: run-log
          path: run.log
          if-no-files-found: ignore
