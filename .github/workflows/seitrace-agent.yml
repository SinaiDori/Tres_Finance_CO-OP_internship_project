name: seitrace-agent

on:
  workflow_dispatch: {}
  schedule:
    - cron: "47 8 * * *"   # daily 08:47 UTC = 11:47 Jerusalem (while DST)

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: seitrace-agent
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system deps (Xvfb for headful Chromium)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
        

      # Cache pip wheels
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements1.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Cache Playwright browsers
      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements1.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          pip install -r requirements1.txt
          python -m playwright install --with-deps chromium

      # If your code is headless, replace this with: `python your_script.py`
      - name: Run script (headful via Xvfb)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # add any other secrets your code needs:
          # TEMPMAIL_TOKEN: ${{ secrets.TEMPMAIL_TOKEN }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          xvfb-run -a python main_seitrace.py 2>&1 | tee run.log

      - name: Slack message (all keys)
        if: ${{ always() }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SEITRACE_CHANNEL_ID: ${{ secrets.SLACK_SEITRACE_CHANNEL_ID }}
        run: |
          set -e
          if [ -s seitrace_api_keys.csv ]; then
            JSON_PAYLOAD=$(python - <<'PY'
          import os, json
          ch = os.environ["SLACK_SEITRACE_CHANNEL_ID"]
          with open("seitrace_api_keys.csv","r") as f:
              keys = [ln.strip() for ln in f if ln.strip()]
          text = "\n".join(keys) if keys else "No API keys produced."
          print(json.dumps({"channel": ch, "text": text}))
          PY
          )
              else
                JSON_PAYLOAD=$(python - <<'PY'
          import os, json
          print(json.dumps({"channel": os.environ["SLACK_SEITRACE_CHANNEL_ID"], "text": "No API keys produced."}))
          PY
          )
              fi
          
              curl -sS -X POST https://slack.com/api/chat.postMessage \
                -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
                -H "Content-type: application/json; charset=utf-8" \
                --data "$JSON_PAYLOAD"

        
      # Optional: keep a backup artifact (auto-expires)
      - name: Upload artifact (CSV)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: seitrace_api_keys_${{ github.run_id }}
          path: seitrace_api_keys.csv
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload full logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: run-log
          path: run.log
          if-no-files-found: ignore

