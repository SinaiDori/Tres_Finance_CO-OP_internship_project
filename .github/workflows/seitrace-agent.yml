# GITHUB ACTIONS WORKFLOW - SEITRACE API KEY AUTOMATION
# This workflow orchestrates cloud-based execution of the SeiTrace API key generation process.
# It sets up a complete Ubuntu environment with virtual display capabilities, installs browser
# automation dependencies, executes the main_seitrace.py script with IMAP email integration,
# and automatically posts results to Slack channels. The workflow includes comprehensive caching
# for performance, artifact collection for troubleshooting, and runs on a scheduled basis with
# timezone-aware cron jobs. Unlike other workflows, video recording is disabled by default for
# performance, but can be easily re-enabled for debugging purposes.
# The workflow runs each mornoing at 8:00 local time.


name: seitrace-agent

on:
  workflow_dispatch: {}
  schedule:
    # Apr–Oct (IDT, UTC+3): 08:00 local = 05:00 UTC
    - cron: "0 5 * 4-10 *"
    # Jan–Mar & Nov–Dec (IST, UTC+2): 08:00 local = 06:00 UTC
    - cron: "0 6 * 1-3,11-12 *"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: seitrace-agent
      cancel-in-progress: false

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install only what we need now (no recorder)
      - name: Install system deps (Xvfb only)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      # --- VIDEO: install deps for recording (commented) ---
      # - name: Install system deps (Xvfb + ffmpeg + WM)
      #   run: |
      #     sudo apt-get update
      #     sudo apt-get install -y xvfb ffmpeg fluxbox

      # Cache pip wheels
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements1.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # Cache Playwright browsers
      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements1.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Python deps
        run: |
          python -m pip install -U pip
          pip install -r requirements1.txt
          python -m playwright install --with-deps chromium

      # Simple headful run (no recording)
      - name: Run script (headful via Xvfb)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IMAP_HOST: imap.gmail.com
          IMAP_PORT: 993
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -e
          xvfb-run -a python main_seitrace.py 2>&1 | tee run.log

      # --- VIDEO: recorded session (commented) ---
      # - name: Run script (recorded Xvfb session)
      #   env:
      #     OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      #     IMAP_HOST: imap.gmail.com
      #     IMAP_PORT: 993
      #     IMAP_USER: ${{ secrets.IMAP_USER }}
      #     IMAP_PASS: ${{ secrets.IMAP_PASS }}
      #     PYTHONUNBUFFERED: "1"
      #   run: |
      #     set -euo pipefail
      #     export DISPLAY=:99
      #     Xvfb $DISPLAY -screen 0 1650x800x24 -ac +extension RANDR &
      #     XVFB_PID=$!
      #     sleep 2
      #     fluxbox >/dev/null 2>&1 &
      #     WM_PID=$!
      #     sleep 1
      #     ffmpeg -y -nostdin -loglevel warning \
      #       -f x11grab -framerate 20 -video_size 1650x800 -i $DISPLAY \
      #       -c:v libx264 -preset veryfast -pix_fmt yuv420p -movflags +faststart \
      #       run.mp4 >/dev/null 2>&1 &
      #     REC_PID=$!
      #     set +e
      #     python main_seitrace.py 2>&1 | tee run.log
      #     STATUS=${PIPESTATUS[0]}
      #     set -e
      #     kill -INT "$REC_PID" || true
      #     wait "$REC_PID" || true
      #     kill "$WM_PID" "$XVFB_PID" || true
      #     exit $STATUS

      - name: Slack message (all keys)
        if: ${{ always() }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SEITRACE_CHANNEL_ID: ${{ secrets.SLACK_SEITRACE_CHANNEL_ID }}
        run: |
          set -e
          if [ -s seitrace_api_keys.csv ]; then
            JSON_PAYLOAD=$(python - <<'PY'
          import os, json
          ch = os.environ["SLACK_SEITRACE_CHANNEL_ID"]
          with open("seitrace_api_keys.csv","r") as f:
              keys = [ln.strip() for ln in f if ln.strip()]
          text = "\n".join(keys) if keys else "No API keys produced."
          print(json.dumps({"channel": ch, "text": text}))
          PY
          )
          else
            JSON_PAYLOAD=$(python - <<'PY'
          import os, json
          print(json.dumps({"channel": os.environ["SLACK_SEITRACE_CHANNEL_ID"], "text": "No API keys produced."}))
          PY
          )
          fi
          curl -sS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
            -H "Content-type: application/json; charset=utf-8" \
            --data "$JSON_PAYLOAD"

      # Optional: keep a backup artifact (auto-expires)
      - name: Upload artifact (CSV)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: seitrace_api_keys_${{ github.run_id }}
          path: seitrace_api_keys.csv
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload full logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: run-log
          path: run.log
          if-no-files-found: ignore

